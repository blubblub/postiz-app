name: Deploy Integration

# Builds the Postiz image from this branch and deploys it to
# postiz.blubtools.com (DO droplet). Every merge to feature/integration
# goes live automatically (~10 min). See /opt/postiz on the droplet.

on:
  push:
    branches: [feature/integration]
  workflow_dispatch:

concurrency:
  group: deploy-integration
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ steps.vars.outputs.sha_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: vars
        run: echo "sha_tag=integration-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/blubblub/postiz-app:integration
            ghcr.io/blubblub/postiz-app:${{ steps.vars.outputs.sha_tag }}
          build-args: |
            NEXT_PUBLIC_VERSION=${{ steps.vars.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy to droplet
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GHCR_TOKEN: ${{ github.token }}
          SHA_TAG: ${{ needs.build.outputs.sha_tag }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "165.245.254.117 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIC5xuP9g97LVUQS3prqQae+1tizU5KlHYdnVrNsxttGx" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            root@165.245.254.117 "$SHA_TAG $GHCR_TOKEN"
